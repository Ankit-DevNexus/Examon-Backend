name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no examonuser@72.61.240.108 "
            cd /var/www/examon-backend/Examon-Backend &&
            git pull origin main &&
            npm install &&
            pm2 restart examon-backend || pm2 start src/index.js --name examon-backend
          "
